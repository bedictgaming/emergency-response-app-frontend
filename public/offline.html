<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#db0000">
  <title>Offline — Emergency Response</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6efed;color:#0f172a;font-family:Arial,sans-serif;padding:24px}.card{max-width:480px;background:#fff;border:1px solid #fecdd3;border-radius:24px;padding:32px;box-shadow:0 20px 50px #88133718;text-align:center}.icon{width:72px;height:72px;border-radius:20px;margin:0 auto 20px;display:grid;place-items:center;background:#e11d48;color:#fff;font-size:36px;font-weight:900}h1{margin:0 0 12px;font-size:28px}p{margin:8px 0;color:#475569;line-height:1.55}.warning{margin-top:20px;border-radius:12px;background:#fef3c7;color:#78350f;padding:12px;font-size:14px;font-weight:600}button{margin-top:22px;border:0;border-radius:12px;background:#0f172a;color:#fff;padding:12px 20px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">+</div>
    <h1>You are offline</h1>
    <p>Reconnect before submitting or updating an emergency report.</p>
    <p class="warning">A report is only accepted after the server confirms it. Nothing entered while offline has been submitted.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
