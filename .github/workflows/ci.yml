name: Frontend checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  local-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_PRODUCTION_VALIDATION: 'false'
      NEXT_PUBLIC_PUBLIC_LAUNCH: 'false'
      NEXT_PUBLIC_PREVIEW_ONLY: 'false'
      NEXT_PUBLIC_STAGING_TEST: 'false'
      NEXT_PUBLIC_EMERGENCY_CANARY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --test scripts/next-root-glob.test.mjs
      - run: npx tsc --noEmit
      - run: npm run test:deployment
      - run: npm run test:gateway
      - run: npm run test:worker
      - run: npm run test:push
      - run: npm run test:architecture
      - run: npm run test:realtime
      - run: node --experimental-strip-types --test scripts/citizen-presence-locations.test.mjs
      - run: npm run test:seo
      - run: node --test scripts/dependency-audit-policy.test.mjs
      - run: node scripts/check-dependency-audit.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - run: node scripts/check-seo-export.mjs .next-e2e private
      - run: npm run test:e2e -- e2e/socket-events.spec.ts --workers=2
        env:
          NEXT_PUBLIC_EMERGENCY_TRANSPORT: socket.io
      - run: npm run test:e2e -- e2e/socket-events.spec.ts --workers=2
        env:
          NEXT_PUBLIC_EMERGENCY_TRANSPORT: sse
          NEXT_PUBLIC_EMERGENCY_CANARY: 'true'
      - run: npm run test:e2e -- e2e/nearby-intake.spec.ts --workers=2
        env:
          NEXT_PUBLIC_NEARBY_REVIEW_ENABLED: 'true'
          NEXT_PUBLIC_EMERGENCY_TRANSPORT: socket.io
          NEXT_PUBLIC_EMERGENCY_CANARY: 'false'
      - run: npm run test:e2e -- e2e/citizen-presence.spec.ts --workers=2
        env:
          NEXT_PUBLIC_NEARBY_REVIEW_ENABLED: 'true'
          NEXT_PUBLIC_CITIZEN_PRESENCE_ENABLED: 'true'
          NEXT_PUBLIC_EMERGENCY_TRANSPORT: socket.io
          NEXT_PUBLIC_EMERGENCY_CANARY: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presence-export-screenshots
          path: test-results/**/online-*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results
          retention-days: 7
      # API mocks and local export only; never use live deployment credentials.
